name: Test, Lint, and Build

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
      
      - name: Install OpenConnect
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect
          echo "✓ OpenConnect installed"
      
      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted. Run: gofmt -s -w ."
            gofmt -s -d .
            exit 1
          fi
          echo "✓ Code formatting check passed"
      
      - name: Lint (go vet)
        run: |
          go vet ./...
          echo "✓ Linting passed"
      
      - name: Run tests
        run: |
          go test ./...
          echo "✓ Tests passed"
      
      - name: Security scan (govulncheck)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          echo "✓ Security scan passed"
      
      - name: Build binaries
        run: |
          mkdir -p build
          go build -o build/occlient ./cmd/occlient
          go build -o build/occlientd ./cmd/occlientd
          echo "✓ Binaries built successfully"
      
      - name: Verify binaries
        run: |
          ./build/occlient --version
          ./build/occlient -h | grep -q "Usage:"
          ./build/occlient connect -h | grep -q "Usage:"
          test -x ./build/occlientd
          go version -m ./build/occlientd | grep -Fq 'github.com/JacobBananalDev/openconnect-client/cmd/occlientd'
          echo "✓ Binary verification passed"
